[project]
name = "youtube-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nvm-slayer", email = "sraj58540@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2.1",
    "groq>=1.7.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.67.0",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
youtube-rag = "youtube_rag:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
